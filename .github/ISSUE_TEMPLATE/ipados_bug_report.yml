name: iPadOS bug report
description: Report a reproducible problem with LibrePaint on iPadOS
title: "[iPadOS Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve LibrePaint on iPadOS.

        This tracker is for problems specific to this iPadOS port. For bugs that
        also reproduce in an official desktop or Android build of Krita, please
        use the [upstream Krita bug tracker](https://bugs.kde.org/).

        Do not attach Apple IDs, certificates, provisioning profiles, device
        credentials, or other signing secrets.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues for the same problem.
          required: true
        - label: I checked whether this reproduces with the latest available release of this iPadOS port.
          required: true
        - label: This problem is specific to the iPadOS port, or I do not have evidence that it is an upstream Krita bug.
          required: true

  - type: dropdown
    id: problem_type
    attributes:
      label: Problem type
      description: Select the closest match.
      options:
        - Installation or signing
        - App exits during launch
        - Crash or hang after launch
        - Canvas, rendering, or OpenGL
        - Touch, gesture, or Apple Pencil
        - User interface, layout, or rotation
        - File open, save, import, or export
        - Performance or memory
        - Other
    validations:
      required: true

  - type: input
    id: release
    attributes:
      label: LibrePaint iPadOS release or build
      description: Include the release tag or custom commit, the IPA filename, and where you obtained it. Do not report only "latest."
      placeholder: "Example: v1.0.1, LibrePaint-iPad-unsigned.ipa, built from this repository"
    validations:
      required: true

  - type: input
    id: ipa_checksum
    attributes:
      label: IPA SHA-256
      description: If you can calculate it, provide the complete SHA-256 checksum of the installed IPA.
      placeholder: Optional

  - type: dropdown
    id: installation_method
    attributes:
      label: Installation method
      options:
        - AltStore (direct IPA installation)
        - LiveContainer
        - Another sideloading method
    validations:
      required: true

  - type: input
    id: installer_version
    attributes:
      label: Installer version
      description: Include the AltStore, LiveContainer, or other installer version.
      placeholder: "Example: AltStore 2.x"
    validations:
      required: true

  - type: dropdown
    id: installation_state
    attributes:
      label: Installation state
      description: This helps distinguish first-run resource initialization from an upgrade problem.
      options:
        - Fresh install or recreated app data
        - Upgrade over an existing installation
        - Reproduces in both states
        - Unknown
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: iPad model
      description: Use the model name shown in Settings, including generation and size where applicable.
      placeholder: "Example: iPad (10th generation)"
    validations:
      required: true

  - type: input
    id: ipados
    attributes:
      label: iPadOS version and build
      description: Find this under Settings → General → About. Include the build number when available.
      placeholder: "Example: iPadOS 17.x (build …)"
    validations:
      required: true

  - type: input
    id: free_storage
    attributes:
      label: Available storage
      description: Especially useful for installation, resource-database, and memory-related problems.
      placeholder: "Example: 20 GB available"

  - type: dropdown
    id: frequency
    attributes:
      label: Reproduction frequency
      options:
        - Every time
        - Often
        - Sometimes
        - Once
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Start from installation or app launch and list each action in order.
      placeholder: |
        1. Install …
        2. Launch LibrePaint from …
        3. …
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual behavior
      description: Describe exactly what happened and how long it took.
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: launch_details
    attributes:
      label: Launch details
      description: Complete this when LibrePaint exits, crashes, or hangs during launch. Other reports may leave it blank.
      placeholder: |
        - Did you launch from the Home Screen, AltStore, or LiveContainer?
        - Did you see only the standard iOS launch screen, or the LibrePaint splash screen?
        - If the LibrePaint splash appeared, what was its last message (for example, "Loading resources...")?
        - Approximately how many seconds passed before the app exited or stopped responding?
        - What happens when you launch it again without reinstalling?

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic reports
      description: |
        For a crash, unexpected exit, or hang, open Settings → Privacy & Security
        → Analytics & Improvements → Analytics Data and find the newest
        `krita*.ips` report. Also find the matching `JetsamEvent*.ips` report if
        present. Record their filenames here, compress the reports into a ZIP
        archive, and upload it in the next field.

        You may redact device identifiers, but keep the exception type,
        termination reason, triggered thread, and thread backtraces. Optionally
        include `krita.log` if you can access the app container. For a non-crash
        issue, enter "Not applicable." If no report was created, say so.
      placeholder: List the report filenames, or explain why none are available.
    validations:
      required: true

  - type: upload
    id: diagnostic_files
    attributes:
      label: Diagnostic file upload
      description: Upload the ZIP containing the `.ips` reports and any available `.log` or text logs.
    validations:
      accept: ".zip,.log,.txt,.json"

  - type: upload
    id: media
    attributes:
      label: Screenshots or screen recording
      description: Upload files when they help show the problem. Remove personal information first.
    validations:
      accept: ".png,.jpg,.jpeg,.gif,.webp,.mp4,.mov,.webm"

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Include recent configuration changes, document details, and anything else that may be relevant.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I checked the attachments and removed Apple IDs, signing secrets, certificates, provisioning profiles, and other sensitive information.
          required: true
