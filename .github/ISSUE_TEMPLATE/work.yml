name: 作業Issue
description: 目的、範囲、前提、完了条件と検証を定義する
projects:
  - serika12345/2
body:
  - type: textarea
    id: outcome
    attributes:
      label: 目的と観測する結果
      description: 利用者、操作、期待する結果と現状の問題を具体的に記載してください。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 範囲と所有者
      description: まとめて実装する関連機能と利用経路、所有ファイル、対象OSを記載してください。構造変更は移動元と移動先を示してください。
    validations:
      required: true
  - type: textarea
    id: prerequisites
    attributes:
      label: 前提と関連Issue
      description: 必要な成果と所有Issueを併記してください。前提がなければ、その旨を記載してください。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 完了条件
      description: 関連実装を統合した版で観測する結果と、最終受入れ条件を記載してください。途中コミットとは区別してください。
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: 検証方法と停止条件
      description: 実装中に必要な局所確認と、統合後にまとめて行う検証・対象OSを分けて記載してください。早期の全体検査が必要な具体的条件と、実装を止める条件を示してください。
    validations:
      required: true
