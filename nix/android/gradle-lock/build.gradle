buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.12.0'
    }
}

apply plugin: 'com.android.application'

dependencies {
    // Core 1.17 requires compile SDK 36; the product contract remains API 35.
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.annotation:annotation:1.10.0'
}

android {
    namespace = "org.librepaint.gradlelock"
    compileSdkVersion "android-35"
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId "org.librepaint.gradlelock"
        minSdkVersion 28
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
