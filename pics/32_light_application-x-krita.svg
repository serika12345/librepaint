<?xml version="1.0" encoding="UTF-8"?>
<svg id="iconCanvas" xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" data-export-ready="true"><title id="iconTitle">LibrePaint palette icon</title><desc id="iconDescription">A circular paint palette made from seven round color swatches.</desc><defs><filter id="panelShadow" x="-40%" y="-40%" width="180%" height="190%" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#171A21" flood-opacity="0.1"/></filter><filter id="swatchShadow" x="-50%" y="-50%" width="200%" height="220%" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#171A21" flood-opacity="0.13"/></filter></defs><g transform="translate(512 484) scale(1.36) translate(-575 -675)"><g aria-label="Paint color selector"><circle cx="575" cy="675" r="268" fill="#FFFFFF" stroke="#ECEEF2" stroke-width="4" filter="url(#panelShadow)"/><circle cx="575" cy="675" r="178" fill="none" stroke="#F0F2F5" stroke-width="8" stroke-linecap="round" stroke-dasharray="3 23"/><g data-color="#FF5C5C" aria-label="Coral"><circle cx="696.6223663640861" cy="553.3776336359138" r="54" fill="#FFFFFF" filter="url(#swatchShadow)"/><circle cx="696.6223663640861" cy="553.3776336359138" r="48" fill="#FF5C5C"/></g><g data-color="#FF9F1C" aria-label="Orange"><circle cx="575" cy="503" r="54" fill="#FFFFFF" filter="url(#swatchShadow)"/><circle cx="575" cy="503" r="48" fill="#FF9F1C"/></g><g data-color="#FFD84D" aria-label="Yellow"><circle cx="453.3776336359138" cy="553.3776336359139" r="54" fill="#FFFFFF" filter="url(#swatchShadow)"/><circle cx="453.3776336359138" cy="553.3776336359139" r="48" fill="#FFD84D"/></g><g data-color="#34C77B" aria-label="Green"><circle cx="403" cy="675" r="54" fill="#FFFFFF" filter="url(#swatchShadow)"/><circle cx="403" cy="675" r="48" fill="#34C77B"/></g><g data-color="#24BFD5" aria-label="Cyan"><circle cx="453.37763363591387" cy="796.6223663640861" r="54" fill="#FFFFFF" filter="url(#swatchShadow)"/><circle cx="453.37763363591387" cy="796.6223663640861" r="48" fill="#24BFD5"/></g><g data-color="#3274F5" aria-label="Blue"><circle cx="575" cy="847" r="54" fill="#FFFFFF" filter="url(#swatchShadow)"/><circle cx="575" cy="847" r="48" fill="#3274F5"/></g><g data-color="#9B5DE5" aria-label="Violet, selected"><circle cx="696.6223663640861" cy="796.6223663640861" r="54" fill="#FFFFFF" filter="url(#swatchShadow)"/><circle cx="696.6223663640861" cy="796.6223663640861" r="48" fill="#9B5DE5"/></g></g></g></svg>